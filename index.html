<!DOCTYPE html>
<html lang="ur-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Factor — Upload to Drive</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f6e63'/%3E%3Ctext x='32' y='45' font-family='Arial,sans-serif' font-size='38' font-weight='800' fill='white' text-anchor='middle'%3EF%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f3f5f6;--ink:#121a1e;--mute:#5c6b73;--line:#d7dee1;--card:#ffffff;
  --acc:#0f6e63;--acc-ink:#ffffff;--acc2:#e6f2f0;--err:#ba1a1a;--err-bg:#fdecea;--ok:#0f6e63;
  --radius:16px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c1416;--ink:#eaf1f0;--mute:#93a5a9;--line:#263338;--card:#121c1f;
    --acc:#3ddbc6;--acc-ink:#07211d;--acc2:#132a27;--err:#ff8a80;--err-bg:#2a1413;--ok:#3ddbc6;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1416;--ink:#eaf1f0;--mute:#93a5a9;--line:#263338;--card:#121c1f;
  --acc:#3ddbc6;--acc-ink:#07211d;--acc2:#132a27;--err:#ff8a80;--err-bg:#2a1413;--ok:#3ddbc6;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.5 -apple-system,"Segoe UI",system-ui,sans-serif;
  display:flex;justify-content:center;align-items:flex-start;
  padding:32px 16px 48px;
}
main{width:100%;max-width:460px}

.brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.mark{
  width:44px;height:44px;min-width:44px;min-height:44px;border-radius:12px;flex:0 0 44px;
  background:linear-gradient(135deg,var(--acc),#0a4b44);
  display:flex;align-items:center;justify-content:center;line-height:1;
  font-weight:800;font-size:1.3rem;color:#fff!important;letter-spacing:-.02em;
  box-shadow:0 4px 14px -4px rgba(15,110,99,.5);
}
.brand h1{font-size:1.4rem;margin:0;letter-spacing:-.01em}
.brand p{margin:2px 0 0;color:var(--mute);font-size:.88rem}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px;box-shadow:0 1px 3px rgba(0,0,0,.04)}

label{display:block;font-size:.85rem;font-weight:600;color:var(--mute);margin-bottom:6px}
.pwrap{position:relative}
input[type=password],input[type=text]{
  width:100%;padding:13px 44px 13px 14px;border:1.5px solid var(--line);border-radius:10px;
  background:transparent;color:inherit;font:inherit;font-size:16px;
}
input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc2)}
.eye{
  position:absolute;right:4px;top:50%;transform:translateY(-50%);
  background:none;border:0;padding:8px;color:var(--mute);border-radius:8px;
}
.eye:hover{color:var(--ink)}

button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:13px 20px;
  background:var(--acc);color:var(--acc-ink);font-weight:700;font-size:.97rem}
button:active{transform:translateY(1px)}
button:disabled{opacity:.6;cursor:default}
button.block{width:100%;margin-top:14px}
button.ghost{background:transparent;color:var(--mute);border:1px solid var(--line);padding:7px 14px;font-weight:600;font-size:.85rem}
button:focus-visible,input:focus-visible,.drop:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

#msg{min-height:1.3em;margin:0 0 4px;color:var(--err);font-size:.87rem}
#msg:empty{display:none}

.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:4px}
.top .hint{font-size:.85rem;color:var(--mute)}

.drop{margin-top:16px;border:2px dashed var(--line);border-radius:12px;padding:40px 16px;
  text-align:center;cursor:pointer;color:var(--mute);transition:background .15s,border-color .15s}
.drop.over{background:var(--acc2);border-color:var(--acc);color:var(--ink)}
.drop svg{opacity:.55;margin-bottom:10px}
.drop strong{display:block;color:var(--ink);font-size:1.02rem;margin-bottom:14px}
.drop .browse{padding:10px 22px;font-size:.92rem}

#list{margin-top:18px;display:grid;gap:10px}
.row{border:1px solid var(--line);border-radius:12px;padding:13px}
.row .n{font-weight:600;word-break:break-all;font-size:.93rem}
.row .m{font-size:.82rem;color:var(--mute);display:flex;justify-content:space-between;gap:8px;margin-top:7px;flex-wrap:wrap}
.bar{height:7px;background:var(--acc2);border-radius:99px;overflow:hidden;margin-top:9px}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
.err{color:var(--err)} .okc{color:var(--ok);font-weight:600}

.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--acc2);border-top-color:var(--acc);
  animation:sp .8s linear infinite;display:inline-block;vertical-align:-4px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
.loading{display:flex;align-items:center;justify-content:center;gap:4px;padding:30px 0;color:var(--mute);font-size:.9rem}
.waking{font-size:.8rem;color:var(--mute);margin-top:10px;text-align:center}

[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:.01ms!important}}
</style>
</head>
<body>
<main>
  <div class="brand">
    <div class="mark">F</div>
    <div>
      <h1>Factor</h1>
      <p>Kahin se bhi upload karo, seedha Google Drive mein</p>
    </div>
  </div>

  <section id="boot" class="card">
    <div class="loading"><span class="spin"></span>Connect ho raha hai...</div>
    <p class="waking" id="wakingMsg" hidden>Server neend se jaag raha hai, thoda sa wait karo...</p>
  </section>

  <section id="login" class="card" hidden>
    <label for="pw">Password</label>
    <div class="pwrap">
      <input id="pw" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="text">
      <button type="button" class="eye" id="eye" aria-label="Password dikhao">
        <svg id="eyeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
    <p id="msg" role="alert"></p>
    <button id="loginBtn" class="block">Login</button>
  </section>

  <section id="app" class="card" hidden>
    <div class="top"><span class="hint">Max file size: 2 GB</span><button class="ghost" id="logout">Logout</button></div>
    <div class="drop" id="drop" tabindex="0" role="button" aria-label="Files chuno">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      <strong>Files yahan drop karo</strong>
      <button type="button" class="browse" id="browseBtn">Browse Files</button>
    </div>
    <input id="file" type="file" hidden accept="*/*">
    <div id="list"></div>
  </section>
</main>

<script>
const CHUNK = 32 * 256 * 1024;            // 8 MB, 256KB ka multiple
const MAX = 2 * 1024 ** 3 + 1024 ** 2;
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const fmt = b => b >= 1e9 ? (b/1e9).toFixed(2)+" GB" : b >= 1e6 ? (b/1e6).toFixed(1)+" MB" : Math.max(1,Math.round(b/1e3))+" KB";

async function api(path, body, timeoutMs) {
  const ctrl = new AbortController();
  const t = timeoutMs ? setTimeout(() => ctrl.abort(), timeoutMs) : null;
  try {
    const r = await fetch(path, {
      method: body ? "POST" : "GET",
      headers: {"Content-Type": "application/json"},
      body: body ? JSON.stringify(body) : undefined,
      signal: ctrl.signal
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw Object.assign(new Error(j.detail || "Error"), {status: r.status});
    return j;
  } finally { if (t) clearTimeout(t); }
}

/* ---------- boot / login ---------- */
function showScreen(which) {
  $("boot").hidden = which !== "boot";
  $("login").hidden = which !== "login";
  $("app").hidden = which !== "app";
  if (which === "login") setTimeout(() => $("pw").focus(), 50);
}

(async () => {
  const wakeTimer = setTimeout(() => { $("wakingMsg").hidden = false; }, 4000);
  try {
    const j = await api("/api/me", null, 60000);  // Render free tier cold start allow karo
    clearTimeout(wakeTimer);
    showScreen(j.ok ? "app" : "login");
  } catch (e) {
    clearTimeout(wakeTimer);
    showScreen("login");
    $("msg").textContent = "Server se connect nahi ho saka. Page reload karo.";
  }
})();

async function doLogin() {
  $("msg").textContent = "";
  const btn = $("loginBtn");
  btn.disabled = true; btn.textContent = "Checking...";
  try {
    await api("/api/login", {password: $("pw").value});
    $("pw").value = "";
    showScreen("app");
  } catch (e) {
    $("msg").textContent = e.message;
  } finally {
    btn.disabled = false; btn.textContent = "Login";
  }
}
$("loginBtn").onclick = doLogin;
$("pw").onkeydown = e => e.key === "Enter" && doLogin();
$("eye").onclick = () => {
  const showing = $("pw").type === "text";
  $("pw").type = showing ? "password" : "text";
  $("eyeIcon").innerHTML = showing
    ? '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>'
    : '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.6 21.6 0 0 1 5.06-6.06M9.9 4.24A10.4 10.4 0 0 1 12 4c7 0 11 8 11 8a21.6 21.6 0 0 1-2.22 3.22M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
};
$("logout").onclick = async () => { try { await api("/api/logout", {}); } catch {} showScreen("login"); };

/* ---------- drop zone ---------- */
const drop = $("drop");
drop.onclick = () => $("file").click();
drop.onkeydown = e => (e.key === "Enter" || e.key === " ") && (e.preventDefault(), $("file").click());
$("browseBtn").onclick = e => { e.stopPropagation(); $("file").click(); };
["dragenter","dragover"].forEach(t => drop.addEventListener(t, e => {e.preventDefault(); drop.classList.add("over");}));
["dragleave","drop"].forEach(t => drop.addEventListener(t, e => {e.preventDefault(); drop.classList.remove("over");}));
drop.addEventListener("drop", e => enqueue(e.dataTransfer.files));
$("file").onchange = e => { enqueue(e.target.files); e.target.value = ""; };

const queue = []; let running = false;
function enqueue(files) {
  for (const f of files) {
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = '<div class="n"></div><div class="bar"><i></i></div><div class="m"><span class="st">Line mein</span><span class="sp"></span></div>';
    row.querySelector(".n").textContent = f.name + " (" + fmt(f.size) + ")";
    $("list").prepend(row);
    queue.push({file: f, row});
  }
  runQueue();
}
async function runQueue() {
  if (running) return; running = true;
  while (queue.length) { const j = queue.shift(); await uploadOne(j.file, j.row); }
  running = false;
}

/* ---------- resumable upload ---------- */
function putChunk(url, blob, start, total, onProg) {
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest();
    x.open("PUT", url);
    const end = start + blob.size - 1;
    x.setRequestHeader("Content-Range", blob.size ? `bytes ${start}-${end}/${total}` : `bytes */${total}`);
    x.upload.onprogress = e => onProg && onProg(e.loaded);
    x.onload = () => resolve({status: x.status, range: x.getResponseHeader("Range"), text: x.responseText});
    x.onerror = () => reject(new Error("network"));
    x.ontimeout = () => reject(new Error("network"));
    x.send(blob);
  });
}
const nextFromRange = (range, fallback) => {
  if (!range) return fallback;
  const m = /bytes=0-(\d+)/.exec(range); return m ? +m[1] + 1 : fallback;
};
async function serverOffset(url, total) {           // "kahan tak upload hua?"
  const r = await putChunk(url, new Blob([]), 0, total);
  if (r.status === 200 || r.status === 201) return total;
  if (r.status === 308) return nextFromRange(r.range, 0);
  throw Object.assign(new Error("status " + r.status), {status: r.status});
}

async function uploadOne(file, row) {
  const st = row.querySelector(".st"), sp = row.querySelector(".sp"), bar = row.querySelector("i");
  const fail = msg => { st.textContent = msg; st.className = "st err"; };
  if (file.size === 0) return fail("Khali file upload nahi ho sakti");
  if (file.size > MAX) return fail("2 GB se badi file");

  let url;
  try { url = (await api("/api/init", {name: file.name, size: file.size, type: file.type})).uploadUrl; }
  catch (e) { return e.status === 401 ? (showScreen("login"), fail("Dobara login karo")) : fail(e.message); }

  let offset = 0, retries = 0, t0 = performance.now(), base = 0;
  st.textContent = "Upload ho rahi hai...";
  while (offset < file.size) {
    const end = Math.min(offset + CHUNK, file.size);
    const chunkStart = offset;
    try {
      const r = await putChunk(url, file.slice(offset, end), offset, file.size, loaded => {
        const done = chunkStart + loaded;
        bar.style.width = (done / file.size * 100) + "%";
        const s = (done - base) / ((performance.now() - t0) / 1000);
        sp.textContent = fmt(s) + "/s  •  " + Math.round(done / file.size * 100) + "%";
      });
      if (r.status === 200 || r.status === 201) { offset = file.size; break; }
      if (r.status === 308) { offset = nextFromRange(r.range, end); retries = 0; continue; }
      if (r.status === 404 || r.status === 410) return fail("Session expire, file dobara upload karo");
      if (r.status === 401 || r.status === 403) return fail("Drive ne mana kiya (" + r.status + "). Server ka token/CORS check karo");
      throw new Error("status " + r.status);
    } catch (e) {
      if (++retries > 8) return fail("Upload fail. Dobara koshish karo.");
      st.textContent = `Connection masla, resume ho raha hai (${retries}/8)...`;
      await sleep(Math.min(1000 * 2 ** retries, 30000));
      try { offset = await serverOffset(url, file.size); base = offset; t0 = performance.now(); }
      catch (e2) { if (e2.status === 404 || e2.status === 410) return fail("Session expire, file dobara upload karo"); }
    }
  }
  bar.style.width = "100%"; sp.textContent = "";
  st.textContent = "Drive mein save ho gayi"; st.className = "st okc";
}
</script>
</body>
</html>
