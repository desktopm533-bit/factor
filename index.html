<!DOCTYPE html>
<html lang="ur-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4a82da">
<meta name="color-scheme" content="light">
<title>Factor — Upload to Drive</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #0a3f87;
  --navy-hover: #08336d;
  --line: rgba(255, 255, 255, .78);
  --soft: rgba(255, 255, 255, .72);
  --err: #ffc2c2;
  --ok: #b8f5d2;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
html { background: #2a65bd; scroll-padding-top: env(safe-area-inset-top, 0px); }

/* ---- blurred blue backdrop (same on login + upload page) ---- */
body {
  position: relative;
  min-height: 100vh;
  background: #2a65bd;
  color: #fff;
  font: 400 15px/1.5 "Montserrat", "Segoe UI", system-ui, -apple-system, sans-serif;
  display: flex;
  justify-content: center;
  padding: 40px 20px 56px;
  overflow-x: hidden;
}
body::before {
  content: ""; position: fixed; inset: -10%; z-index: -1; pointer-events: none;
  background:
    radial-gradient(38% 34% at 6% 6%,  #d4e6ff 0%, rgba(212, 230, 255, 0) 100%),
    radial-gradient(40% 40% at 88% 36%, #6fa6f2 0%, rgba(111, 166, 242, 0) 100%),
    radial-gradient(46% 42% at 4% 92%,  #1a53a8 0%, rgba(26, 83, 168, 0) 100%),
    radial-gradient(40% 36% at 100% 100%, #082e6e 0%, rgba(8, 46, 110, 0) 100%),
    linear-gradient(160deg, #5b97ec 0%, #2a65bd 55%, #1d4f9e 100%);
  filter: blur(26px);
}
main { width: 100%; max-width: 340px; margin: auto 0; text-align: center; }
main.wide { max-width: 520px; }

/* ---- logo: white plate so the grey wordmark stays readable on blue ---- */
.plate {
  display: inline-flex; align-items: center; justify-content: center;
  background: #fff; border-radius: 14px; padding: 14px 24px;
  box-shadow: 0 10px 30px rgba(6, 36, 90, .28);
}
.plate img { display: block; height: 30px; width: auto; }

h1 {
  margin: 22px 0 34px; font-size: 1.5rem; font-weight: 300;
  letter-spacing: .2em; text-transform: uppercase; color: rgba(255, 255, 255, .92);
}
.sub { margin: -20px 0 26px; color: var(--soft); font-size: .85rem; }

/* ---- underline fields ---- */
.field { position: relative; display: flex; align-items: center; gap: 14px; border-bottom: 1px solid var(--line); margin-bottom: 26px; transition: border-color .2s; }
.field:focus-within { border-bottom-color: #fff; box-shadow: 0 1px 0 #fff; }
.field > svg { flex: 0 0 18px; color: #fff; }
.field input {
  flex: 1; min-width: 0; padding: 10px 0; border: 0; background: transparent; color: #fff;
  font: inherit; font-size: 16px; letter-spacing: .02em;
}
.field input::placeholder { color: rgba(255, 255, 255, .9); }
.field input:focus { outline: none; }
.field input:-webkit-autofill { -webkit-text-fill-color: #fff; transition: background-color 9999s ease-in-out 0s; }
.eye { background: none; border: 0; padding: 6px; margin-right: -6px; color: var(--soft); cursor: pointer; border-radius: 4px; display: flex; }
.eye:hover { color: #fff; }

.opts { display: flex; align-items: center; justify-content: flex-start; margin: -2px 0 24px; font-size: .78rem; }
.check { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; color: #fff; user-select: none; }
.check input { position: absolute; opacity: 0; width: 0; height: 0; }
.check .box { width: 14px; height: 14px; background: rgba(6, 36, 90, .35); border: 1px solid var(--line); display: grid; place-items: center; }
.check .box svg { opacity: 0; width: 10px; height: 10px; }
.check input:checked + .box { background: var(--navy); border-color: var(--navy); }
.check input:checked + .box svg { opacity: 1; }
.check input:focus-visible + .box { outline: 2px solid #fff; outline-offset: 2px; }

/* ---- buttons ---- */
button { font: inherit; cursor: pointer; }
.btn {
  width: 100%; height: 46px; border: 0; border-radius: 0; background: var(--navy); color: #fff;
  font-size: .78rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
  transition: background .2s, opacity .2s;
}
.btn:hover { background: var(--navy-hover); }
.btn:disabled { opacity: .65; cursor: default; }
.btn.sm { width: auto; height: 40px; padding: 0 26px; }
.link { background: none; border: 0; padding: 4px; color: #fff; font-style: italic; font-size: .78rem; text-decoration: underline; text-underline-offset: 3px; opacity: .9; }
.link:hover { opacity: 1; }
button:focus-visible, .drop:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

#msg { margin: 0 0 16px; color: var(--err); font-size: .82rem; text-align: left; }
#msg:empty { display: none; }

/* ---- upload page ---- */
.drop {
  border: 1px dashed rgba(255, 255, 255, .7); background: rgba(255, 255, 255, .07);
  padding: 42px 16px; cursor: pointer; transition: background .2s, border-color .2s;
}
.drop.over, .drop:hover { background: rgba(255, 255, 255, .15); border-color: #fff; }
.drop svg { color: #fff; margin-bottom: 14px; }
.drop strong { display: block; font-weight: 400; font-size: 1rem; letter-spacing: .04em; margin-bottom: 18px; }
#list { margin-top: 22px; display: grid; gap: 12px; text-align: left; }
.row { background: rgba(6, 40, 98, .5); padding: 14px 16px; }
.row .n { font-weight: 500; font-size: .88rem; word-break: break-all; }
.row .m { font-size: .76rem; color: var(--soft); display: flex; justify-content: space-between; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.bar { height: 3px; background: rgba(255, 255, 255, .22); margin-top: 12px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: #fff; transition: width .2s ease-out; }
.err { color: var(--err); }
.okc { color: var(--ok); font-weight: 600; }
.foot { margin-top: 30px; }

.spin { width: 22px; height: 22px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .3); border-top-color: #fff; animation: sp .8s linear infinite; display: inline-block; vertical-align: -5px; margin-right: 10px; }
@keyframes sp { to { transform: rotate(360deg); } }
.loading { padding: 10px 0; color: #fff; font-size: .9rem; }
.waking { font-size: .8rem; color: var(--soft); margin-top: 8px; }

[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation-duration: .01ms !important; } }
</style>
</head>
<body>

<!-- boot -->
<main id="boot">
  <div class="plate"><img src="/factor-logo.png" alt="Factor"></div>
  <h1>Factor</h1>
  <div class="loading"><span class="spin"></span>Connect ho raha hai...</div>
  <p class="waking" id="wakingMsg" hidden>Server neend se jaag raha hai, thoda sa wait karo...</p>
</main>

<!-- login -->
<main id="login" hidden>
  <div class="plate"><img src="/factor-logo.png" alt="Factor"></div>
  <h1>Login</h1>
  <form id="loginForm" novalidate>
    <div class="field">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <input id="user" name="username" type="text" placeholder="Username" aria-label="Username" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false">
    </div>
    <div class="field">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17 9h-1V7a4 4 0 0 0-8 0v2H7a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2zm-7-2a2 2 0 0 1 4 0v2h-4V7z"/></svg>
      <input id="pw" name="password" type="password" placeholder="Password" aria-label="Password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false">
      <button type="button" class="eye" id="eye" aria-label="Password dikhao">
        <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
    <div class="opts">
      <label class="check">
        <input type="checkbox" id="remember">
        <span class="box"><svg viewBox="0 0 12 12" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6.5l2.5 2.5L10 3"/></svg></span>
        Remember me
      </label>
    </div>
    <p id="msg" role="alert"></p>
    <button type="submit" id="loginBtn" class="btn">Login</button>
  </form>
</main>

<!-- upload page -->
<main id="app" class="wide" hidden>
  <div class="plate"><img src="/factor-logo.png" alt="Factor"></div>
  <h1>Upload</h1>
  <p class="sub">Seedha Google Drive mein &nbsp;•&nbsp; Max file size: 2 GB</p>
  <div class="drop" id="drop" tabindex="0" role="button" aria-label="Files chuno">
    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    <strong>Files yahan drop karo</strong>
    <button type="button" class="btn sm" id="browseBtn">Browse Files</button>
  </div>
  <input id="file" type="file" hidden accept="*/*">
  <div id="list"></div>
  <div class="foot"><button class="link" id="logout">Logout</button></div>
</main>

<script>
const CHUNK = 32 * 256 * 1024;            // 8 MB, 256KB ka multiple
const MAX = 2 * 1024 ** 3 + 1024 ** 2;
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const fmt = b => b >= 1e9 ? (b/1e9).toFixed(2)+" GB" : b >= 1e6 ? (b/1e6).toFixed(1)+" MB" : Math.max(1,Math.round(b/1e3))+" KB";

async function api(path, body, timeoutMs) {
  const ctrl = new AbortController();
  const t = timeoutMs ? setTimeout(() => ctrl.abort(), timeoutMs) : null;
  try {
    const r = await fetch(path, {
      method: body ? "POST" : "GET",
      headers: {"Content-Type": "application/json"},
      body: body ? JSON.stringify(body) : undefined,
      signal: ctrl.signal
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw Object.assign(new Error(j.detail || "Error"), {status: r.status});
    return j;
  } finally { if (t) clearTimeout(t); }
}

/* ---------- boot / login ---------- */
const store = {
  get: k => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
  del: k => { try { localStorage.removeItem(k); } catch {} }
};
function showScreen(which) {
  $("boot").hidden = which !== "boot";
  $("login").hidden = which !== "login";
  $("app").hidden = which !== "app";
  if (which === "login") setTimeout(() => ($("user").value ? $("pw") : $("user")).focus(), 50);
}
(function restoreUser() {
  const u = store.get("factor_user");
  if (u) { $("user").value = u; $("remember").checked = true; }
})();

(async () => {
  const wakeTimer = setTimeout(() => { $("wakingMsg").hidden = false; }, 4000);
  try {
    const j = await api("/api/me", null, 60000);  // Render free tier cold start allow karo
    clearTimeout(wakeTimer);
    showScreen(j.ok ? "app" : "login");
  } catch (e) {
    clearTimeout(wakeTimer);
    showScreen("login");
    $("msg").textContent = "Server se connect nahi ho saka. Page reload karo.";
  }
})();

async function doLogin() {
  $("msg").textContent = "";
  const username = $("user").value.trim();
  if (!username || !$("pw").value) { $("msg").textContent = "Username aur password dono likhein"; return; }
  const btn = $("loginBtn");
  btn.disabled = true; btn.textContent = "Checking...";
  try {
    await api("/api/login", {username, password: $("pw").value});
    if ($("remember").checked) store.set("factor_user", username); else store.del("factor_user");
    $("pw").value = "";
    showScreen("app");
  } catch (e) {
    $("msg").textContent = e.message;
  } finally {
    btn.disabled = false; btn.textContent = "Login";
  }
}
$("loginForm").addEventListener("submit", e => { e.preventDefault(); doLogin(); });
$("eye").onclick = () => {
  const showing = $("pw").type === "text";
  $("pw").type = showing ? "password" : "text";
  $("eyeIcon").innerHTML = showing
    ? '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>'
    : '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.6 21.6 0 0 1 5.06-6.06M9.9 4.24A10.4 10.4 0 0 1 12 4c7 0 11 8 11 8a21.6 21.6 0 0 1-2.22 3.22M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
};
$("logout").onclick = async () => { try { await api("/api/logout", {}); } catch {} showScreen("login"); };

/* ---------- drop zone ---------- */
const drop = $("drop");
drop.onclick = () => $("file").click();
drop.onkeydown = e => (e.key === "Enter" || e.key === " ") && (e.preventDefault(), $("file").click());
$("browseBtn").onclick = e => { e.stopPropagation(); $("file").click(); };
["dragenter","dragover"].forEach(t => drop.addEventListener(t, e => {e.preventDefault(); drop.classList.add("over");}));
["dragleave","drop"].forEach(t => drop.addEventListener(t, e => {e.preventDefault(); drop.classList.remove("over");}));
drop.addEventListener("drop", e => enqueue(e.dataTransfer.files));
$("file").onchange = e => { enqueue(e.target.files); e.target.value = ""; };

const queue = []; let running = false;
function enqueue(files) {
  for (const f of files) {
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = '<div class="n"></div><div class="bar"><i></i></div><div class="m"><span class="st">Line mein</span><span class="sp"></span></div>';
    row.querySelector(".n").textContent = f.name + " (" + fmt(f.size) + ")";
    $("list").prepend(row);
    queue.push({file: f, row});
  }
  runQueue();
}
async function runQueue() {
  if (running) return; running = true;
  while (queue.length) { const j = queue.shift(); await uploadOne(j.file, j.row); }
  running = false;
}

/* ---------- resumable upload ---------- */
function putChunk(url, blob, start, total, onProg) {
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest();
    x.open("PUT", url);
    const end = start + blob.size - 1;
    x.setRequestHeader("Content-Range", blob.size ? `bytes ${start}-${end}/${total}` : `bytes */${total}`);
    x.upload.onprogress = e => onProg && onProg(e.loaded);
    x.onload = () => resolve({status: x.status, range: x.getResponseHeader("Range"), text: x.responseText});
    x.onerror = () => reject(new Error("network"));
    x.ontimeout = () => reject(new Error("network"));
    x.send(blob);
  });
}
const nextFromRange = (range, fallback) => {
  if (!range) return fallback;
  const m = /bytes=0-(\d+)/.exec(range); return m ? +m[1] + 1 : fallback;
};
async function serverOffset(url, total) {           // "kahan tak upload hua?"
  const r = await putChunk(url, new Blob([]), 0, total);
  if (r.status === 200 || r.status === 201) return total;
  if (r.status === 308) return nextFromRange(r.range, 0);
  throw Object.assign(new Error("status " + r.status), {status: r.status});
}

async function uploadOne(file, row) {
  const st = row.querySelector(".st"), sp = row.querySelector(".sp"), bar = row.querySelector("i");
  const fail = msg => { st.textContent = msg; st.className = "st err"; };
  if (file.size === 0) return fail("Khali file upload nahi ho sakti");
  if (file.size > MAX) return fail("2 GB se badi file");

  let url;
  try { url = (await api("/api/init", {name: file.name, size: file.size, type: file.type})).uploadUrl; }
  catch (e) { return e.status === 401 ? (showScreen("login"), fail("Dobara login karo")) : fail(e.message); }

  let offset = 0, retries = 0, t0 = performance.now(), base = 0;
  st.textContent = "Upload ho rahi hai...";
  while (offset < file.size) {
    const end = Math.min(offset + CHUNK, file.size);
    const chunkStart = offset;
    try {
      const r = await putChunk(url, file.slice(offset, end), offset, file.size, loaded => {
        const done = chunkStart + loaded;
        bar.style.width = (done / file.size * 100) + "%";
        const s = (done - base) / ((performance.now() - t0) / 1000);
        sp.textContent = fmt(s) + "/s  •  " + Math.round(done / file.size * 100) + "%";
      });
      if (r.status === 200 || r.status === 201) { offset = file.size; break; }
      if (r.status === 308) { offset = nextFromRange(r.range, end); retries = 0; continue; }
      if (r.status === 404 || r.status === 410) return fail("Session expire, file dobara upload karo");
      if (r.status === 401 || r.status === 403) return fail("Drive ne mana kiya (" + r.status + "). Server ka token/CORS check karo");
      throw new Error("status " + r.status);
    } catch (e) {
      if (++retries > 8) return fail("Upload fail. Dobara koshish karo.");
      st.textContent = `Connection masla, resume ho raha hai (${retries}/8)...`;
      await sleep(Math.min(1000 * 2 ** retries, 30000));
      try { offset = await serverOffset(url, file.size); base = offset; t0 = performance.now(); }
      catch (e2) { if (e2.status === 404 || e2.status === 410) return fail("Session expire, file dobara upload karo"); }
    }
  }
  bar.style.width = "100%"; sp.textContent = "";
  st.textContent = "Drive mein save ho gayi"; st.className = "st okc";
}
</script>
</body>
</html>
